# The web container: the built app, and the API behind it on the compose network.
# The host's nginx terminates TLS and forwards everything here
# (deploy/nginx/weather.prabhavalabs.com.conf).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # The host's nginx sets X-Real-IP from the client; pass it on rather than this hop's
    # address, so the API's rate limits see the visitor.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;

    location /v1/ { proxy_pass http://api:8080; }
    location /api/ { proxy_pass http://api:8080; }
    location = /healthz { proxy_pass http://api:8080; }
    location = /readyz { proxy_pass http://api:8080; }

    # Hashed build output never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx's mime.types has no entry for .mjs, and a module worker sent as
        # octet-stream never runs. The build names MapLibre's worker .js; this
        # covers any .mjs that still ships.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # The service worker, the page and the manifest must be checked on every load,
    # or an update never reaches an installed app (ADR 0017).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri /index.html;
    }
}
