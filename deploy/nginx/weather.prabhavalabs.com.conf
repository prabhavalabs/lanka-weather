# Host nginx site for weather.prabhavalabs.com, installed as
# /etc/nginx/sites-available/lanka-weather. Certbot adds the TLS server block
# and the redirect from HTTP (`certbot --nginx -d weather.prabhavalabs.com`).

server {
    listen 80;
    listen [::]:80;
    server_name weather.prabhavalabs.com;

    location / {
        proxy_pass http://127.0.0.1:18750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
