name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
        env:
          POSTGRES_USER: lankaweather
          POSTGRES_PASSWORD: lankaweather
          POSTGRES_DB: lankaweather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lankaweather -d lankaweather_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LANKAWEATHER_TEST_DATABASE_URL: postgres://lankaweather:lankaweather@localhost:5432/lankaweather_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make bootstrap
      - run: make ci
